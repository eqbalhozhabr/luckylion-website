<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dubiko</title>
<style>
  :root {
    --bg: #f4ead8; --panel: #fffaf0; --ink: #33291c; --muted: #7d6e57; --line: #d9c9a8;
    --btn: #ffffff; --btn-hover: #f6efe0; --cell-bg: #efe3c9; --cell-line: #e3d3b0;
    --note-bg: #fdf0c9; --note-line: #e6cd84; --accent: #d99a3a; --accent-line: #b9802a; --ring: #f2d9a3;
    --edge: rgba(30,24,15,.8); --bad: #d8452f; --good: #2a8f52; --badge: #ffffff;
    --cell: min(64px, calc((100vw - 96px) / var(--n, 5)));
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #17140f; --panel: #221d15; --ink: #efe6d4; --muted: #a89878; --line: #3d3527;
    --btn: #2d271d; --btn-hover: #3a3226; --cell-bg: #2f291f; --cell-line: #40382a;
    --note-bg: #3a3116; --note-line: #6b5a22; --accent: #e0a446; --accent-line: #b9802a; --ring: #5a4520;
    --bad: #f0705a; --good: #4cc07c; --badge: #2d271d; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #17140f; --panel: #221d15; --ink: #efe6d4; --muted: #a89878; --line: #3d3527;
    --btn: #2d271d; --btn-hover: #3a3226; --cell-bg: #2f291f; --cell-line: #40382a;
    --note-bg: #3a3116; --note-line: #6b5a22; --accent: #e0a446; --accent-line: #b9802a; --ring: #5a4520;
    --bad: #f0705a; --good: #4cc07c; --badge: #2d271d; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; }
  button { font: inherit; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
           border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent-line); color: #fff; font-weight: 600; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-line); color: #fff; }
  input[type=number] { width: 64px; font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); color: var(--ink); }
  select { font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); color: var(--ink); }
  small.mut, .mut { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .dev { display: none; }
  body.test .dev { display: revert; }

  /* ------------------------------------------------ menu */
  .screen { min-height: 100vh; min-height: 100dvh; }
  #scr-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #menuCity { display: block; max-width: 100%; margin-bottom: -6px; }
  .menu-box { width: min(360px, 100%); display: grid; gap: 10px; text-align: center; }
  .logo { margin: 0; font-size: 44px; letter-spacing: 1px; line-height: 1.1; }
  .tag { margin: 0 0 10px; color: var(--muted); }
  .menu-box button.big { padding: 12px 16px; font-size: 18px; border-radius: 14px; }
  .menu-box p { margin: 4px 0 0; }
  .small { font-size: 13px; }

  /* ---------------------------------------- bars (levels, settings) */
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
         position: sticky; top: 0; z-index: 3; }
  .bar h2 { margin: 0; font-size: 20px; }
  .page { max-width: 640px; margin: 0 auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

  /* ------------------------------------------------ levels */
  .pack h3 { margin: 4px 2px 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .pack h3 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; direction: ltr; }
  .lv { position: relative; aspect-ratio: 1; padding: 0; display: grid; place-items: center; font-weight: 700; font-size: 18px; border-radius: 12px; }
  .lv.solved { border-color: var(--good); }
  .lv.solved::after { content: "✓"; position: absolute; bottom: 2px; right: 6px; font-size: 13px; color: var(--good); }
  .lv.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
  .lv.locked { opacity: .4; }
  .lv .tagi { position: absolute; top: 2px; left: 4px; font-size: 13px; }
  .lv .boss { position: absolute; top: 2px; right: 4px; font-size: 13px; }

  /* ------------------------------------------------ settings */
  .setrow { display: grid; gap: 8px; }
  .setrow > label, .setrow > .lbl { font-weight: 600; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 88px; }
  .row2 { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }

  /* ------------------------------------------------ help */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; max-width: 460px; width: 100%; max-height: 90dvh; overflow: auto; }
  .dlg h2 { margin: 0 0 8px; }
  .dlg ol { padding-inline-start: 22px; margin: 0 0 12px; display: grid; gap: 8px; }

  /* ------------------------------------------------ game */
  #scr-game > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #scr-game > header .sp { flex: 1; }
  main { max-width: 980px; margin: 0 auto; padding: 14px; display: grid; gap: 14px;
         grid-template-columns: 1fr; }
  @media (min-width: 820px) { main { grid-template-columns: auto 280px; align-items: start; } }
  #intro { background: var(--note-bg); border-color: var(--note-line); }
  #intro:empty { display: none; }
  #boardWrap { direction: ltr; display: grid; justify-content: center; }
  #board { display: grid; gap: 0; user-select: none; touch-action: manipulation;
           --lw: 34px; --lh: 34px; padding: 0 var(--lw) var(--lh) 0;
           grid-template-columns: var(--lw) repeat(var(--n, 5), auto);
           grid-template-rows: var(--lh) repeat(var(--n, 5), auto); }
  .lab { min-width: 0; min-height: 0; overflow: visible; display: flex; gap: 2px; align-items: center; justify-content: center;
         flex-wrap: wrap; font-size: 13px; padding: 2px; }
  .lab.col { flex-direction: column; }
  .badge { display: inline-flex; align-items: center; gap: 1px; padding: 1px 5px; border-radius: 999px;
           background: var(--badge); border: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .badge.bad { border-color: var(--bad); color: var(--bad); }
  .cell { width: var(--cell); height: var(--cell); position: relative; background: var(--cell-bg);
          border: 1px solid var(--cell-line); display: flex; align-items: center; justify-content: center;
          font-size: calc(var(--cell) * .48); cursor: pointer; }
  .cell.filled { border-color: transparent; }
  .cell .ic { pointer-events: none; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .cell.water { background: #4fa6cb; border-color: #3f93b6; cursor: default; }
  .cell.water .ic { opacity: .55; }
  .cell.lm::after { content: "📌"; position: absolute; top: 1px; left: 2px; font-size: 11px; }
  .cell.pv-ok { outline: 3px solid var(--good); outline-offset: -3px; }
  .cell.pv-no { outline: 3px solid var(--bad); outline-offset: -3px; }
  .cell.err { animation: shake .35s; }
  .cell.err::before { content: ""; position: absolute; inset: 0; background: rgba(216,69,47,.28); pointer-events: none; }
  .cell.flash { animation: flash 1.1s 2; }
  @keyframes flash { 50% { filter: brightness(1.35) saturate(1.6); box-shadow: inset 0 0 0 4px var(--panel); } }
  @keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  body.calm .cell.err, body.calm .cell.flash { animation: none; }
  #panel { display: grid; gap: 14px; align-content: start; }
  #tray { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; position: sticky; top: 0; z-index: 2; background: var(--panel); padding-bottom: 6px; }
  .tabs button { flex: 1; padding: 7px 8px; }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent-line); color: #fff; font-weight: 600; }
  .tp { position: relative; padding: 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--btn);
        cursor: pointer; direction: ltr; }
  .tp.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .tp.gone { opacity: .25; pointer-events: none; }
  .tp .n { position: absolute; top: -8px; right: -8px; background: var(--ink); color: var(--bg); border-radius: 999px;
           min-width: 20px; height: 20px; font-size: 12px; display: grid; place-items: center; padding: 0 4px; }
  .mini { display: grid; gap: 1px; }
  .mini i { width: var(--mc, 16px); height: var(--mc, 16px); border-radius: 3px; display: block; }
  .mini i.e { background: transparent; }
  .mini-cv { display: block; }
  ul.rules { margin: 6px 0 0; padding-inline-start: 18px; }
  ul.rules li { margin: 3px 0; font-size: 14px; }
  #msg { min-height: 24px; margin-top: 8px; font-weight: 600; }
  #msg.good { color: var(--good); } #msg.bad { color: var(--bad); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #win { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: center; z-index: 9;
         padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  #win.on { display: flex; }
  #win .box { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
              padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;
              box-shadow: 0 6px 24px rgba(0,0,0,.28); }
  #iso { display: block; margin: 0 auto; touch-action: manipulation; cursor: pointer; max-width: 100%; }
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .views { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .acts { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .ib .ic { margin-inline-end: 6px; }
  .ib .ic:only-child { margin: 0; }
  #rulesBtn { display: none; }
  #sheet .sheethead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  #sheet .sheethead h2 { margin: 0; }
  #sheet ul.rules li { font-size: 16px; }
  .coach { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 8px; padding: 8px 12px;
           background: var(--note-bg); border: 1px solid var(--note-line); border-radius: 12px; font-size: 15px; font-weight: 600; }
  .coach button { flex: none; padding: 4px 10px; font-size: 13px; font-weight: 400; }
  .tp.pulse { animation: pulse 1.2s ease-in-out infinite; border-color: var(--accent); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--ring); } }
  body.calm .tp.pulse { animation: none; box-shadow: 0 0 0 4px var(--ring); }
  #loading { text-align: center; color: var(--muted); padding: 30px; }
  /* phones: icons instead of words, the board takes all the room, the buildings sit in one strip under it */
  @media (max-width: 819px) {
    #board { --cell: min(64px, calc((100vw - 20px - 2 * var(--lw)) / var(--n, 5)), calc((100dvh - 275px - 2 * var(--lh)) / var(--n, 5))); }
    #scr-game { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    #scr-game > header { flex: none; padding: 5px 8px; gap: 6px; flex-wrap: nowrap; }
    #scr-game > header small.mut { display: none; }
    #scr-game > header input[type=number] { width: 52px; }
    #lvTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ib .tx { display: none; }
    .ib { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; font-size: 20px; line-height: 1; flex: none; }
    .ib .ic { margin: 0; }
    #scr-game main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 6px; width: 100%; max-width: none; margin: 0; }
    #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px; position: relative; }
    .tools { flex: none; margin: 0 0 4px; flex-wrap: nowrap; }
    .views, .acts { flex-wrap: nowrap; gap: 4px; }
    #tiltWrap { position: absolute; left: 8px; bottom: 34px; z-index: 2; }
    #rulesBtn { display: inline-grid; }
    #loading { padding: 20px; }
    #boardWrap { flex: 1; min-height: 0; align-content: center; overflow: hidden; }
    #msg { position: absolute; left: 10px; right: 10px; top: 56px; margin: 0; min-height: 0; padding: 4px 10px; text-align: center;
           font-size: 14px; background: var(--panel); border-radius: 10px; pointer-events: none; z-index: 2; }
    #msg:empty { display: none; }
    #testInfo { flex: none; margin-top: 2px !important; font-size: 11px; line-height: 1.3; }
    #panel { flex: none; display: block; padding-bottom: env(safe-area-inset-bottom, 0px); }
    #intro, .tabs, #tabRules, #tabTray > small { display: none !important; }
    #tabsCard { padding: 4px 0; }
    #tray { flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin: 0; padding: 10px 12px 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .tp { flex: none; padding: 4px; scroll-snap-align: start; --mc: 24px; }
    #stage { padding: 6px 2px; }
    #sheet { place-items: end center; padding: 0; }
    .sheetbox { border-radius: 16px 16px 0 0; max-width: none; max-height: 62dvh; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    .logo { font-size: 38px; }
  }
</style>
</head>
<body>

<!-- ===== menu ===== -->
<div id="scr-menu" class="screen" hidden>
  <canvas id="menuCity" aria-hidden="true"></canvas>
  <div class="menu-box">
    <h1 class="logo">Dubiko</h1>
    <p class="tag" data-i18n="menu.tagline"></p>
    <button class="primary big" id="mPlay"></button>
    <button class="big" id="mLevels" data-i18n="menu.levels"></button>
    <button class="big" id="mHelp" data-i18n="menu.help"></button>
    <button class="big" id="mSettings" data-i18n="menu.settings"></button>
    <p class="mut" id="mProgress"></p>
    <p class="mut small"><span data-i18n="menu.by"></span><span class="dev"> · <span data-i18n="menu.test"></span></span></p>
  </div>
</div>

<!-- ===== level select ===== -->
<div id="scr-levels" class="screen" hidden>
  <div class="bar"><button id="lBack" data-i18n="nav.back"></button><h2 data-i18n="levels.title"></h2></div>
  <div class="page" id="lvList"></div>
</div>

<!-- ===== settings ===== -->
<div id="scr-settings" class="screen" hidden>
  <div class="bar"><button id="sBack" data-i18n="nav.back"></button><h2 data-i18n="settings.title"></h2></div>
  <div class="page">
    <div class="card setrow"><span class="lbl" data-i18n="settings.language"></span>
      <div class="seg" id="sLang"><button data-v="fa">فارسی</button><button data-v="en">English</button></div></div>
    <div class="card setrow"><span class="lbl" data-i18n="settings.theme"></span>
      <div class="seg" id="sTheme"><button data-v="auto" data-i18n="settings.themeAuto"></button><button data-v="light" data-i18n="settings.themeLight"></button><button data-v="dark" data-i18n="settings.themeDark"></button></div></div>
    <div class="card setrow"><span class="lbl" data-i18n="settings.view"></span>
      <div class="seg" id="sView"><button data-v="diamond" data-i18n="game.iso"></button><button data-v="flat" data-i18n="game.flat"></button></div></div>
    <div class="card setrow"><span class="lbl" data-i18n="settings.sound"></span>
      <div class="row2"><button id="sSound" aria-pressed="true"></button>
        <label class="row2" style="flex:1"><span data-i18n="settings.volume"></span><input type="range" id="sVol" min="0" max="100" step="5"></label></div></div>
    <div class="card setrow"><div class="row2"><button id="sCalm" aria-pressed="false"></button></div></div>
    <div class="card setrow"><div class="row2"><button id="sShare" aria-pressed="false"></button></div><small class="mut" data-i18n="settings.shareHelp"></small></div>
    <div class="card setrow"><div class="row2"><button id="sTest" aria-pressed="false"></button></div><small class="mut" data-i18n="settings.testHelp"></small></div>
    <div class="card setrow"><span class="lbl" data-i18n="settings.reset"></span>
      <div class="row2"><button id="sReset" data-i18n="settings.reset"></button></div>
      <div class="row2" id="sResetAsk" hidden><span data-i18n="settings.resetAsk"></span>
        <button id="sResetYes" class="primary" data-i18n="settings.resetYes"></button><button id="sResetNo" data-i18n="settings.cancel"></button></div></div>
    <small class="mut" id="sVersion"></small>
  </div>
</div>

<!-- ===== game ===== -->
<div id="scr-game" class="screen" hidden>
  <header>
    <button id="gMenu" class="ib" data-i18n-title="nav.menu"><span class="ic">☰</span><span class="tx" data-i18n="nav.menu"></span></button>
    <b id="lvTitle"></b>
    <button id="prev" class="ib"></button>
    <button id="next" class="ib"></button>
    <span class="sp"></span>
    <span class="dev gotoWrap"><label><small class="mut" data-i18n="game.goto"></small> <input id="goto" type="number" min="1" value="1"></label>
      <button id="go" data-i18n="game.go"></button></span>
  </header>
  <main>
    <section class="card" id="stage">
      <div class="tools">
        <div class="views" id="views">
          <button class="ib" data-v="diamond" aria-pressed="false" data-i18n-title="game.iso"><span class="ic">◆</span><span class="tx" data-i18n="game.iso"></span></button>
          <button class="ib" data-v="flat" aria-pressed="false" data-i18n-title="game.flat"><span class="ic">▦</span><span class="tx" data-i18n="game.flat"></span></button>
          <button class="ib" id="xray" aria-pressed="false" data-i18n-title="game.xrayTitle"><span class="ic">👁</span><span class="tx" data-i18n="game.xray"></span></button>
          <label id="tiltWrap" class="dev"><small class="mut" data-i18n="game.camera"></small>
            <select id="tilt"><option value="40">64×40 (39°)</option><option value="44">64×44 (43°)</option>
            <option value="48">64×48 (49°)</option><option value="52">64×52 (54°)</option></select></label>
        </div>
        <div class="row acts">
          <button class="ib" id="rulesBtn" data-i18n-title="game.tabRules"><span class="ic">📜</span><span class="tx" data-i18n="game.tabRules"></span></button>
          <button class="ib" id="rot" data-i18n-title="game.rotateTitle"><span class="ic">↻</span><span class="tx" data-i18n="game.rotate"></span></button>
          <button class="ib" id="hint" data-i18n-title="game.hint"><span class="ic">💡</span><span class="tx" data-i18n="game.hint"></span></button>
          <button class="ib" id="clear" data-i18n-title="game.clear"><span class="ic">🗑</span><span class="tx" data-i18n="game.clear"></span></button>
        </div>
      </div>
      <div id="coach" class="coach" hidden><span id="coachText"></span><button id="coachBtn"></button></div>
      <div id="loading"><span data-i18n="game.loading"></span></div>
      <div id="boardWrap"><canvas id="iso"></canvas><div id="board"></div></div>
      <div id="msg"></div>
      <div id="testInfo" class="dev mut small" style="margin-top:8px;direction:ltr"></div>
    </section>
    <aside id="panel">
      <div id="intro" class="card"></div>
      <div class="card" id="tabsCard">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="tray" aria-selected="true" data-i18n="game.tabTray"></button>
          <button role="tab" data-tab="rules" aria-selected="false" data-i18n="game.tabRules"></button>
        </div>
        <div id="tabTray"><small class="mut" data-i18n="game.trayHint"></small><div id="tray"></div></div>
        <div id="tabRules" hidden><ul class="rules" id="rules"></ul></div>
      </div>
    </aside>
  </main>
</div>

<!-- phone: the rules come up as a sheet over the board -->
<div id="sheet" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="dlg sheetbox">
    <div class="sheethead"><h2 data-i18n="game.tabRules"></h2><button id="sheetClose" class="ib" data-i18n-title="help.close"><span class="ic">✕</span></button></div>
    <p id="sheetIntro" class="mut small"></p>
    <ul class="rules" id="sheetRules"></ul>
  </div>
</div>

<div id="win"><div class="box"><b data-i18n="win.title"></b><span id="winText"></span>
  <button class="primary" id="winNext" data-i18n="win.next"></button><button id="winLevels" data-i18n="win.levels"></button></div></div>

<div id="help" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="dlg">
    <h2 data-i18n="help.title"></h2>
    <ol><li data-i18n="help.s1"></li><li data-i18n="help.s2"></li><li data-i18n="help.s3"></li><li data-i18n="help.s4"></li><li data-i18n="help.s5"></li></ol>
    <p class="mut small" data-i18n="help.first"></p>
    <button class="primary" id="hClose" data-i18n="help.close"></button>
